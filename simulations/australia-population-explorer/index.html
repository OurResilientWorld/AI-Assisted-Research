med the two budget forecasts and the student, visitor, working-holiday, skilled-processing and compliance measures in the release."},oneNation:{label:"One Nation \xB7 15 September 2026",url:"https://www.onenation.org.au/immigration-radical-reset",checked:"2026-09-21",sourceType:"primary",verification:"Confirmed the temporary-visa reduction, three years of negative net migration and subsequent net migration ceiling; no annual negative number supplied."},studentFamily:{label:"One Nation \xB7 16 September 2026",url:"https://www.onenation.org.au/student-family-visa-reform",checked:"2026-09-21",sourceType:"primary",verification:"Confirmed the proposed student-family restriction and high-value postgraduate exception."},standing:{label:"One Nation standing policy \xB7 undated, checked 21 September",url:"https://www.onenation.org.au/immigration",checked:"2026-09-21",sourceType:"primary-undated",verification:"Confirmed protection and enforcement proposals. Its visa-cap wording differs from the dated net-migration release; it is not used as the headline model input."},abc:{label:"ABC reporting \xB7 14 September 2026",url:"https://www.abc.net.au/news/2026-09-14/750k-visas-cut-under-one-nation-plan/107149702",checked:"2026-09-21",sourceType:"secondary",verification:"Confirmed the category figures, skilled-family restriction and possible exceptions, and working-holiday/PALM statements as ABC reporting. Primary policy paper not located in the bounded search."}},verificationNote:"Government and party releases were opened online. Additional student, graduate, skilled-family and seasonal-work details remain attributed to ABC; they were not independently confirmed in a primary policy document.",rows:[{category:"Overall migration",labor:"Budget forecasts: net gain of 245,000 in 2026\u201327 and 225,000 in 2027\u201328. These are not visa caps.",oneNation:"750,000 fewer temporary visas; negative net migration for three years, then a 130,000 net migration ceiling.",sources:["labor","oneNation"],model:"The party does not give the annual number leaving minus arriving, or a full breakdown by visa category. The chart exposes its added assumptions."},{category:"Students and their families",labor:"Restrict secondary applicants on most student visas and prevent visa hopping.",oneNation:"Exclude accompanying family, except for a proposed high-value postgraduate visa.",sources:["labor","studentFamily"],model:"Both propose restrictions; the exceptions differ. Neither statement gives an annual family-arrival count."},{category:"Student and graduate numbers",labor:"No separate numerical cap in this release.",oneNation:"ABC reports student places moving from 590,000 to 350,000 and graduates from 270,000 to 40,000.",sources:["labor","abc"],model:"These numbers describe people holding visas or places available, not the number arriving each year. They cannot be entered directly as annual arrivals."},{category:"Skilled workers and their families",labor:"Prioritise processing for specified shortage sectors. No skilled-family ban stated in this release.",oneNation:"ABC reports employer-led skilled entry, but no family places; a spokesperson also mentioned possible needs-based exceptions.",sources:["labor","abc"],model:"Material difference on accompanying family; implementation remains unclear. These are not the permanent Family visa category."},{category:"Visitors",labor:"Add a No Further Stay condition to visitor visas.",oneNation:"No separate visitor measure in the September statements reviewed.",sources:["labor","oneNation","studentFamily"],model:"Changing ability to stay is not the same as banning tourist arrivals. Effects need a behavioural assumption."},{category:"Working holidays and seasonal work",labor:"Ballot for second and third working-holiday years, regional-work requirement and three-month processing.",oneNation:"ABC reports retaining working-holiday and Pacific seasonal-worker settings.",sources:["labor","abc"],model:"Different approach to repeat stays. No numerical departure effect supplied."},{category:"Refugees and humanitarian protection",labor:"No new humanitarian intake figure or protection change in the 17 September release.",oneNation:"Standing policy proposes Temporary Protection Visas and leaving the UN Refugee Convention. The page is undated and contains older headline figures.",sources:["labor","standing"],model:"A clear policy difference, but no verified new annual refugee quota here. Do not assign a zero intake or count a new visa granted to someone already here as a new arrival."},{category:"Visa compliance",labor:"Strengthen departures of people without valid visas and revise character-related directions.",oneNation:"Standing policy calls for removals of unlawful migrants and visa holders who offend.",sources:["labor","standing"],model:"Both propose stronger enforcement. No reliable annual arrival or departure number can be worked out from these statements."}],note:"September 2026 statements take precedence for headline totals. The older, undated One Nation page says 130,000 visas; the dated September release says 130,000 net migration. These are different measures. Category descriptions are not numerical forecasts. P4 remains intentionally unpopulated."},policyInputs:{version:"0.1.0",schema:1,cutoff:"2026-09-07",fingerprint:"746d635f7a29ec2d0e29b1a2367b7e6b11918f4bdfce085de748d59c81546191",firstYear:2027,lastYear:2045,base2025:[[153971,150180,152801,162794,159109,158369,162845,163903,167277,172031,171314,172596,174663,173959,172693,174305,173418,173646,176677,178842,181679,183010,184666,191482,202239,205325,203459,205360,206850,207871,210055,206219,204181,202274,204973,204890,201290,198123,197998,198629,196456,194266,193257,186390,179664,169890,164941,159824,158613,159794,160631,162546,165642,170448,171136,160095,157159,150662,147256,146470,147416,151031,152157,150227,147425,140810,137521,133162,128871,125892,120291,115782,113966,109641,107354,103527,99222,98589,98705,80306,73604,66854,57342,540
