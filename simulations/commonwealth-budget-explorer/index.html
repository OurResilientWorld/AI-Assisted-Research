`)}var pu=[{id:"investment",title:"Business investment & innovation",controls:["company-tax","other-spending"],mechanism:"Better tax design and innovation support may encourage investment and competition.",evidence:"The Productivity Commission\u2019s December 2025 final proposal combines company-tax rates of 20% below a $1 billion turnover threshold and 28% above it with a 5% net cashflow tax. These are a linked design, not free extra revenue. A separate Murphy funded case reports a long-run GDP level gain; it does not provide an annual path for this explorer.",tradeoff:"Lower receipts need funding or a larger deficit. Transition losses, who bears the tax and investment responses matter. CIS challenges assumptions in the earlier November proposal; it is not a review of the final December design.",test:"Use company-tax receipts and innovation spending to state your budget assumption. The sliders do not implement the proposed tax rates or forecast investment.",sources:[["PC final report","https://www.pc.gov.au/inquiries-and-research/resilient-economy/report/"],["CIS challenge to earlier proposal","https://www.cis.org.au/publication/the-unworkable-solution-an-economic-assessment-of-a-cashflow-tax-for-australia/"]]},{id:"taxmix",title:"Tax mix & household compensation",controls:["gst","personal-income-tax","income-support"],mechanism:"A broader tax base can change incentives and the way the budget is funded. Compensation changes who gains and loses.",evidence:"Grattan\u2019s October 2026 package is a one-year 2027\u201328 example: $76 billion extra GST, $33 billion income-tax cuts, $25 billion welfare increases, $38 billion transferred to states, $19 billion less tied grants and $7 billion less state top-ups. This gives $6 billion Commonwealth and $12 billion state budget gains in that package.",tradeoff:"Consumption taxes can take a larger share of lower incomes. The welfare figure already includes indexation. Do not add it twice. Grattan changes intergovernmental arrangements; this explorer instead passes all extra GST to states.",test:"Try extra GST, a personal income-tax reduction and extra income support together. The Commonwealth cost of compensation stays visible. This is your alternative, not a recreation of Grattan\u2019s package.",sources:[["Grattan Budget reboot","https://grattan.edu.au/report/budget-reboot-how-to-fund-australias-future/"],["One-year technical supplement","https://grattan.edu.au/wp-content/uploads/2026/10/Grattan-2026-Budget-reboot-Technical-supplement.pdf"]]},{id:"care",title:"Health, care & prevention",controls:["health","aged-care","ndis"],mechanism:"Better prevention and coordination may improve health, participation and the quality of care.",evidence:"The PC prevention example has $1.5 billion of costs over five years and $2.7 billion of government benefits over ten years. Those are different periods and not Commonwealth-only annual savings. The report\u2019s benefit-cost results do not supply a 25-year cash response. The example selects programmes with benefit-cost ratios above one, so its benefits reflect a favourable selection and span several governments.",tradeoff:"Upfront funding, delayed benefits, workforce shortages and the split between governments matter. A smaller care budget does not prove greater efficiency or unchanged services.",test:"Set extra health or care costs and compare the budget effect. No later savings are added automatically. For NDIS, inspect both illustrative funding cases below.",sources:[["PC quality care report and Appendix B","https://www.pc.gov.au/inquiries-and-research/quality-care/report/"]]},{id:"skills",title:"Skills, participation & job mobility",controls:["education","income-support"],mechanism:"Education, childcare and fewer barriers to moving jobs may help people participate and use their skills.",evidence:"PC workforce recommendations cover teaching resources, training pathways and occupational entry rules. e61 stresses labour mobility and the relationship between care, participation and fiscal sustainability.",tradeoff:"Benefits depend on access, implementation and employer demand. Spending on a course is not the same as improving a skill. Changes can affect carers and households differently.",test:"Set education and family-assistance spending. GDP and future tax receipts do not rise automatically.",sources:[["PC adaptable workforce","https://www.pc.gov.au/inquiries-and-research/adaptable-workforce/report/"],["e61 reform priorities, pp.3\u20135","https://e61.in/wp-content/uploads/2025/08/Policy_Priorities_for_the_Economic_Reform_Roundtable-003.pdf"]]},{id:"housing",title:"Housing, infrastructure & energy",controls:["infrastructure","other-income-tax"],mechanism:"Better housing supply, transport, energy systems and a more integrated national economy may remove barriers to productive activity.",evidence:"CEDA\u2019s Navigating 2026 identifies these as reform priorities. It provides direction, not a costed 25-year Commonwealth response.",tradeoff:"States and local governments control many decisions. Construction capacity, planning, delivery risk and financing matter. Loans and equity are not treated as direct spending here.",test:"Set additional Commonwealth infrastructure cash and an explicit other-income-tax assumption. Keep capital already in health, education or defence out of infrastructure.",sources:[["CEDA Navigating 2026","https://www.ceda.com.au/research-and-policy/research/economy/navigating-2026"]]},{id:"retirement",title:"Tax concessions & retirement",controls:["personal-income-tax","other-income-tax","pensions"],mechanism:"More consistent taxation of saving may change incentives and broaden the tax base.",evidence:"e61 proposes examining inconsistent capital-income treatment. Reported tax expenditures are not an amount the government can simply recover in cash.",tradeoff:"Saving responses, transitional protection, retirement incomes and different household circumstances matter. A tax-concession change is se
